<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>KrishiVoice - Voice-First AI Farming Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      html, body, #root {
        height: 100%;
        width: 100%;
        font-family: 'Hind Siliguri', 'Noto Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: #0f1f17;
        color: #f0fdf4;
        overflow-x: hidden;
      }
      /* Custom pulse animations for Voice Mic Button */
      @keyframes ripple {
        0% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.25); opacity: 0.3; }
        100% { transform: scale(1.4); opacity: 0; }
      }
      .mic-ripple {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background-color: #22c55e;
        animation: ripple 1.8s infinite ease-out;
        z-index: 0;
      }
      /* Soundwave equalizer bars */
      @keyframes eq {
        0%, 100% { height: 6px; }
        50% { height: 28px; }
      }
      .eq-bar {
        width: 4px;
        background: #22c55e;
        border-radius: 2px;
        animation: eq 0.8s infinite ease-in-out;
      }
      .eq-bar:nth-child(2) { animation-delay: 0.15s; }
      .eq-bar:nth-child(3) { animation-delay: 0.3s; }
      .eq-bar:nth-child(4) { animation-delay: 0.45s; }
      .eq-bar:nth-child(5) { animation-delay: 0.2s; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
